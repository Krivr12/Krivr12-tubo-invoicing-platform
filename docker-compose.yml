  version: '3.8'

  services:
    postgres:
      image: postgres:16-alpine
      container_name: tubo-postgres
      restart: always
      environment:
        POSTGRES_USER: tubo_user
        POSTGRES_PASSWORD: tubo_password
        POSTGRES_DB: tubo_db
      ports:
        - "5433:5432"
      volumes:
        - tubo_pgdata:/var/lib/postgresql/data

  volumes:
    tubo_pgdata: